name: Build release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build MSI and portable EXE
        shell: pwsh
        run: ./build.ps1 -OutputDirectory build/release
      - name: Check TightVNC file transfers
        shell: powershell
        run: ./tests/windows/tight-files.ps1 -Exe build/release/SshManager.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            build/release/SshManagerSetup.msi
            build/release/SshManager.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Linux updater
        run: PYTHONPATH=linux python3 -B -m unittest discover -s linux/tests -v
      - name: Build DEB and TAR.GZ
        shell: bash
        run: |
          sh linux/build.sh build/linux
          version="$(PYTHONPATH=linux python3 -B -c 'from ssh_manager import VERSION; print(VERSION)')"
          PYTHONPATH=linux python3 -B - "build/linux/ssh-manager-linux-${version}.tar.gz" "$version" <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import sys
          from ssh_manager.updates import unpack_application
          with TemporaryDirectory() as scratch:
              unpack_application(Path(sys.argv[1]), Path(scratch) / "app", sys.argv[2])
          PY
          mv "build/linux/ssh-manager-desktop_${version}_all.deb" build/linux/SSH-Manager-Linux.deb
          mv "build/linux/ssh-manager-linux-${version}.tar.gz" build/linux/SSH-Manager-Linux.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: |
            build/linux/SSH-Manager-Linux.deb
            build/linux/SSH-Manager-Linux.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal DMG
        shell: bash
        run: ./macos/build.sh build/macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: build/macos/SSH-Manager-macOS.dmg
          if-no-files-found: error
      # Smoke check: the built app starts and shows its window (test hosts from TEST-NET-1 only).
      - name: Screenshot of the running app
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p build/macos-screens "$HOME/Applications" "$HOME/.ssh"
          hdiutil attach -readonly -nobrowse -mountpoint /tmp/sshm-image build/macos/SSH-Manager-macOS.dmg
          ditto "/tmp/sshm-image/SSH Manager.app" "$HOME/Applications/SSH Manager.app"
          hdiutil detach /tmp/sshm-image
          printf 'Host web-prod\n  HostName 192.0.2.10\n  User deploy\nHost bastion\n  HostName 192.0.2.11\n' >> "$HOME/.ssh/config"
          open "$HOME/Applications/SSH Manager.app"
          sleep 10
          screencapture -x build/macos-screens/01-window.png
          pgrep -x SshManager >/dev/null && echo "SSH Manager is running" || { echo "SSH Manager is not running"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-screens
          path: build/macos-screens
          if-no-files-found: ignore
