name: Publish release

# Pushing a tag vX.Y.Z builds every platform and publishes the release with the notes in docs/releases/X.Y.Z.md.
# Run it by hand with a tag name to build and check everything without publishing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to check, such as v1.17.2 (nothing is published)'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions match the tag
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -eu
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag $TAG is not vX.Y.Z"; exit 1 ;; esac
          version="${TAG#v}"
          linux="$(PYTHONPATH=linux python3 -B -c 'from ssh_manager import VERSION; print(VERSION)')"
          test "$linux" = "$version" || { echo "linux/ssh_manager/__init__.py has $linux"; exit 1; }
          grep -q "version=\"$version.0\"" installer/app.manifest || { echo "installer/app.manifest is not $version.0"; exit 1; }
          grep -q "AssemblyFileVersion(\"$version.0\")" src/AssemblyInfo.cs || { echo "src/AssemblyInfo.cs is not $version.0"; exit 1; }
          grep -q "<string>$version</string>" macos/Resources/Info.plist || { echo "macos/Resources/Info.plist is not $version"; exit 1; }
          test -s "docs/releases/$version.md" || { echo "docs/releases/$version.md is missing"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build-release.yml

  rpm:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and install the RPM on Fedora 44
        shell: bash
        run: |
          set -eu
          mkdir -p build/rpm-release
          git -c core.autocrlf=false archive HEAD -o build/rpm-release/source.tar
          docker run --rm -v "$PWD:/work" fedora:44 sh /work/tests/linux/fedora-rpm.sh /work/build/rpm-release
          cp "build/rpm-release/rpm/ssh-manager-desktop-${{ needs.check.outputs.version }}-1.noarch.rpm" SSH-Manager-Linux.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-release
          path: SSH-Manager-Linux.rpm
          if-no-files-found: error

  publish:
    needs: [check, build, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '*-release'
          merge-multiple: true
      - name: Create, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' }}
        shell: bash
        run: python3 -B .github/scripts/publish-release.py
